<style>

    --keep:#A8B6C5; --keep-bg:#1B2A3A; --retag:#86BDF6; --retag-bg:#14304D; --tag:#71D5A4; --tag-bg:#123426;

  }

:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A1521; --surface:#101E2D; --surface-2:#162739; --ink:#E5ECF4; --ink-2:#B2C0CF; --muted:#8597AA; --line:#233548;

<header class="topbar"><div class="topbar-in">
  <a class="brand" href="#overview"><b id="brandName"></b><span id="brandSub"></span></a>
  <div class="spacer"></div>
  <a class="stg" id="siteLink" href="#" target="_blank" rel="noopener">Open site ↗</a>

</div></header>

<script>
/* ---------- row helpers (used by the DATA block) ---------- */
const S = t => ({s:t});
// R(current tag, current text, recommended tag, action, note, new text)
// actions: keep | retag | tag | none   (both modes)
//          rewrite | add | remove      (optimize mode only)
// For "add", pass cur "—" and put the new heading text in `to` (text can be "").
const R = (cur, text, rec, act, note, to) => ({cur, text, rec, act, note: note || "", to: to || ""});
const keepH = (lvl, list) => list.map(t => R(lvl, t, lvl, "keep"));

/* ==================== DATA START ==================== */
const SITE = {
  name: "Example Co",
  url: "https://example-co.webflow.io",   // site the guide checks (staging or live)
  liveDomain: "example.com",               // production domain used for rankings, or "" if not live
  platform: "Webflow",                     // Webflow | WordPress | Shopify | Wix | Other
  mode: "optimize",                        // "live" (tags only, current content) | "optimize" (rewrites)
  checked: "28 September 2026",
  market: "United States",
  kwSource: "Ahrefs Keywords Explorer, United States, September 2026",
  appliedBy: "Alex",
  sharedHeadings: ["Ready for a cleaner workplace?"]  // H2s that repeat on purpose on many pages (footer CTA etc.)
};

const NAV = [
  {label:"Site navigation", items:[
    {id:"home"},
    {group:"Services", items:["office-cleaning"]}
  ]}
];

const PAGES = [
{ id:"home", name:"Home", path:"/", group:null,
  purpose:"Introduces the company and routes buyers to its services and industries.",
  keywords:{ primary:["commercial cleaning services",90], secondary:[["commercial cleaning company",70],["facility services",40]], note:"Owns the brand and the broad category. Service terms stay on service pages." },
  h1:{ cur:"Your all-in-one partner for spotless spaces.", status:"client",
       proposed:"Your all-in-one partner for commercial cleaning services.",
       why:"“Spotless spaces” names no service. Adding “commercial cleaning services” (90/mo) names what buyers search for." },
  rows:[
    S("Hero"),
    R("H1","Your all-in-one partner for spotless spaces.","H1","rewrite","Adds the primary keyword. Needs client sign-off.","Your all-in-one partner for commercial cleaning services."),
    S("Why choose us"), R("H2","Why Choose Example Co","H2","keep"),
    R("strong","Built to scale.","H3","rewrite","Split the bold lead-in into its own H3 above its paragraph.","Built to Scale"),
    S("Services"),
    R("H2","One partner. Four flexible solutions.","H2","rewrite","Names the services instead of a slogan.","Office Cleaning, Floor Care, Day Porters & Window Washing"),
    ...keepH("H3",["Office Cleaning","Floor Care"]),
    S("Footer call to action (shared)"), R("H2","Ready for a cleaner workplace?","H2","keep","Same H2 on every page.")
  ],
  notes:["The Healthcare card links to “#” and no Healthcare page exists."] },

{ id:"office-cleaning", name:"Office Cleaning", path:"/services/office-cleaning", group:"Services",
  purpose:"Sells recurring office cleaning to workplaces.",
  keywords:{ primary:["office cleaning services",500], secondary:[["janitorial services",150],["office deep cleaning",150],["after hours office cleaning",90]] },
  h1:{ cur:"Clean, re-engineered", status:"client", proposed:"Office cleaning, re-engineered",
       why:"The primary keyword “office cleaning services” (500/mo) is missing from the H1. Naming the service fixes it." },
  rows:[
    S("Hero"), R("H1","Clean, re-engineered","H1","rewrite","Adds the primary keyword.","Office cleaning, re-engineered"),
    S("Service plans (tabs)"),
    R("H2","Our Cleaning Plan's","H2","rewrite","Grammar fix.","Our Cleaning Plans"),
    R("—","","H3","add","New H3 at the top of the Nightly tab panel. Uses a secondary keyword.","After-Hours Office Cleaning"),
    R("—","","H3","add","New H3 at the top of the Deep Clean tab panel.","Office Deep Cleaning"),
    S("Features"), R("H2","Technology That Works for You","H2","rewrite","Uses a secondary keyword and makes the H2 unique on the site.","Janitorial Services, Tracked and Verified"),
    R("H3","Eco-friendly supplies","H3","rewrite","The card text is about quality checks.","Quality Checks After Every Visit"),
    R("H3","Flexible scheduling","—","remove","Duplicate card. Remove it or replace it with another feature."),
    S("Benefits"),
    R("H3","Benefits to your organization","H2","retag","Starts its own visual block."),
    R("H4","Healthier workplaces","H3","retag"),
    S("Footer call to action (shared)"), R("H2","Ready for a cleaner workplace?","H2","keep")
  ],
  notes:["The Deep Clean tab says “include” where it should say “includes”."] }
];

const SITEWIDE = [
  ["keep","Nav and footer contain no heading tags."],
  ["content","SEO titles are just page names and no page has a meta description."]
];

const GAPS = [
  {cluster:"carpet cleaning", volume:400, note:"No page targets it. Could be an H2 section on the Floor Care page."}
];
/* ==================== DATA END ==================== */

/* ---------- helpers ---------- */
const LIVE = SITE.mode !== "optimize";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const byId = id => PAGES.find(p => p.id === id);
const isH = t => /^H[1-6]$/.test(t);
const tn = t => (!t || t === "—") ? "text" : t; // "—" marks plain text in the data; show it as a word
const lvl = t => isH(t) ? +t[1] : 0;
const WORK = ["retag","tag","rewrite","add","remove"];
const changes = p => p.rows.filter(r => WORK.includes(r.act));
const countAct = (p, a) => p.rows.filter(r => r.act === a).length;
const finalRows = p => p.rows.filter(r => !r.s && r.act !== "remove" && isH(r.rec));
const finalText = r => r.to || r.text;
const counts = p => { const c = {}; finalRows(p).forEach(r => c[r.rec] = (c[r.rec]||0) + 1); return c; };
const countStr = p => { const c = counts(p); return ["H1","H2","H3","H4","H5","H6"].filter(k => c[k]).map(k => k + " × " + c[k]).join(" · "); };
const suggCount = p => (p.notes ? p.notes.length : 0) + (LIVE && p.h1.proposed ? 1 : 0);
// Close-variant match: every meaningful word of the keyword (plural-insensitive) appears in the text.
const STOP = new Set(["a","an","the","and","or","for","of","to","in","on","with","near","me","&"]);
const stem = w => w.toLowerCase().replace(/[^a-z0-9]/g,"").replace(/(ies)$/,"y").replace(/(es|s)$/,"");
const kwIn = (text, kw) => { const words = new Set(String(text).split(/[\s\-\/,.:;!?’'"()]+/).map(stem).filter(Boolean)); return String(kw).split(/\s+/).filter(w => !STOP.has(w.toLowerCase())).map(stem).filter(Boolean).every(w => words.has(w)); };
const finalH1 = p => { const r = finalRows(p).find(r => r.rec === "H1"); return r ? finalText(r) : ""; };
// Optimize mode: the H1 row in `rows` is the source of truth for the new H1.
if (!LIVE) PAGES.forEach(p => { const f = finalH1(p); p.h1.proposed = (f && f !== p.h1.cur) ? f : ""; });
const SUGG = '<span class="pill p-content">' + (LIVE ? "Suggestion · later" : "Idea") + '</span>';
const ACT = { keep:["p-keep","Keep"], retag:["p-retag","Re-tag"], tag:["p-tag","Make heading"], none:["p-none","Not a heading"], rewrite:["p-rewrite","Rewrite"], add:["p-add","Add heading"], remove:["p-remove","Remove heading"] };
const fmtKw = k => esc(k[0]) + (k[1] !== undefined && k[1] !== null ? ' <b>' + k[1] + '</b>/mo' : "");
function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(e) { return null; } }

/* ---------- automatic checks ---------- */
function pageChecks(p){
  const out = [], rows = finalRows(p), h1s = rows.filter(r => r.rec === "H1");
  out.push([h1s.length === 1, "Exactly one H1 (" + h1s.length + ")"]);
  let prev = 0, skip = null;
  rows.forEach(r => { const L = lvl(r.rec); if (prev && L > prev + 1 && !skip) skip = r.rec + " “" + finalText(r) + "” follows H" + prev; prev = L; });
  out.push([!skip, skip ? "Skipped level: " + skip : "No skipped levels"]);
  if (rows[0]) out.push([rows[0].rec === "H1", rows[0].rec === "H1" ? "H1 is the first heading" : "First heading is " + rows[0].rec + ", not the H1"]);
  const seen = {}, dup = [];
  rows.forEach(r => { const t = finalText(r).toLowerCase(); if (seen[t]) dup.push(finalText(r)); seen[t] = 1; });
  out.push([!dup.length, dup.length ? "Duplicate headings on the page: " + [...new Set(dup)].join(", ") : "No duplicate headings on the page"]);
  if (p.keywords && p.keywords.primary && p.keywords.primary[0]){
    const has = kwIn(finalH1(p), p.keywords.primary[0]);
    out.push([has || LIVE, (has ? "H1 contains" : "H1 does not contain") + " the primary keyword “" + p.keywords.primary[0] + "”" + (!has && LIVE ? " (see the H1 suggestion)" : "")]);
  }
  return out;
}
function siteChecks(){
  const out = [], h1 = {}, kw = {}, h2 = {};
  PAGES.forEach(p => {
    const t = finalH1(p).toLowerCase(); (h1[t] = h1[t] || []).push(p.name);
    if (p.keywords && p.keywords.primary && p.keywords.primary[0]){ const k = p.keywords.primary[0].toLowerCase(); (kw[k] = kw[k] || []).push(p.name); }
    finalRows(p).filter(r => r.rec === "H2").forEach(r => { const x = finalText(r); if ((SITE.sharedHeadings||[]).includes(x)) return; (h2[x.toLowerCase()] = h2[x.toLowerCase()] || new Set()).add(p.name); });
  });
  const dH1 = Object.entries(h1).filter(([k,v]) => v.length > 1), dKw = Object.entries(kw).filter(([k,v]) => v.length > 1);
  out.push([!dH1.length, dH1.length ? "Same H1 on several pages: " + dH1.map(([k,v]) => "“" + k + "” (" + v.join(", ") + ")").join("; ") : "Every page has its own H1"]);
  out.push([!dKw.length, dKw.length ? "Primary keyword owned by several pages: " + dKw.map(([k,v]) => "“" + k + "” (" + v.join(", ") + ")").join("; ") : "Every primary keyword has one owner page"]);
  const dH2 = Object.entries(h2).filter(([k,v]) => v.size > 1);
  out.push([!dH2.length || LIVE, dH2.length ? "H2 repeated across pages (not marked shared): " + dH2.slice(0,6).map(([k,v]) => "“" + k + "” (" + [...v].join(", ") + ")").join("; ") + (LIVE ? " (wording suggestion)" : "") : "No H2 repeats across pages except shared sections"]);
  const pageFails = PAGES.filter(p => pageChecks(p).some(c => !c[0])).map(p => p.name);
  out.push([!pageFails.length, pageFails.length ? "Pages with a failing check: " + pageFails.join(", ") : "All page checks pass"]);
  return out;
}
const checkList = list => '<ul class="notes">' + list.map(c => '<li><span class="pill ' + (c[0] ? "p-pass" : "p-fail") + '">' + (c[0] ? "Pass" : "Fix") + '</span><span>' + esc(c[1]) + '</span></li>').join("") + '</ul>';

/* ---------- nav ---------- */
const EXTRA_TOP = [{id:"overview", name:"Overview & rules"},{id:"keywords", name:"Keyword map"}];
const LATER = {id:"later", name: LIVE ? "All suggestions" : "Client sign-off & ideas"};
function navLink(id, label){

function buildNav(){

  let opts = '<optgroup label="Guide">' + EXTRA_TOP.map(i => '<option value="' + i.id + '">' + esc(i.name) + '</option>').join("") + '</optgroup>';
  NAV.forEach(sec => {
    h += '<div class="navlabel">' + esc(sec.label) + '</div>'; opts += '<optgroup label="' + esc(sec.label) + '">';

        it.items.forEach(id => opts += '<option value="' + id + '">' + esc(it.items.length > 1 ? it.group + " › " + byId(id).name : byId(id).name) + '</option>');
      } else { h += navLink(it.id, it.name); opts += '<option value="' + it.id + '">' + esc(it.name || byId(it.id).name) + '</option>'; }

}

/* ---------- page view ---------- */
function outlineText(p, html){
  return finalRows(p).map(r => { const pad = "  ".repeat(lvl(r.rec) - 1);
    return html ? pad + '<span class="' + (r.rec === "H1" ? "l1" : "lv") + '">' + r.rec + '</span>  ' + esc(finalText(r)) : pad + r.rec + "  " + finalText(r); }).join("\n");
}
function statChips(p){
  const s = (cls, label, n) => n ? '<span class="stat ' + cls + '">' + label + ' <b>' + n + '</b></span>' : "";
  let h = s("s-retag","Re-tag",countAct(p,"retag")) + s("s-tag","Make heading",countAct(p,"tag"));
  if (!LIVE) h += s("s-rewrite","Rewrite",countAct(p,"rewrite")) + s("s-tag","Add",countAct(p,"add")) + s("s-remove","Remove",countAct(p,"remove"));
  if (!changes(p).length) h += '<span class="stat">No changes</span>';
  h += '<span class="stat">After changes: <b>' + countStr(p) + '</b></span>';
  if (LIVE && suggCount(p)) h += s("s-content","Suggestions for later",suggCount(p));
  return h;
}
function renderPage(p){
  const hideKeep = store("hmap-hide-keep") === "1";
  let h = '<div class="crumb"><span>' + esc(p.group || "Page") + '</span><span>›</span><code>' + esc(p.path) + '</code></div>';
  h += '<div class="pagehead"><h1>' + esc(p.name) + '</h1><a class="btn" href="' + esc(SITE.url.replace(/\/$/,"") + p.path) + '" target="_blank" rel="noopener">Open page ↗</a></div>';
  h += '<div class="stats">' + statChips(p) + '</div>';

  // page focus (purpose + keywords)
  if (p.purpose || p.keywords){
    const k = p.keywords || {};
    h += '<section class="card focus" aria-label="Page focus"><div class="h1top"><span class="lbl">What this page is for</span></div>';
    if (p.purpose) h += '<p>' + esc(p.purpose) + '</p>';
    if (k.primary) h += '<div class="kw"><span class="pri">Primary: ' + fmtKw(k.primary) + '</span>' + (k.secondary||[]).map(s => '<span>' + fmtKw(s) + '</span>').join("") + '</div>';
    if (k.note) h += '<p class="why">' + esc(k.note) + '</p>';
    h += '</section>';
  }

  // H1 card
  const H = p.h1, h1row = p.rows.find(r => r.rec === "H1" || r.cur === "H1");
  h += '<section class="card h1card block" aria-label="H1"><div class="h1top"><span class="lbl">The H1 for this page</span>';
  if (LIVE){
    h += '<span class="pill p-keep">Use current text</span></div>';
    h += '<div class="h1main"><small>Make this the H1</small><div class="t">' + esc(H.cur) + '</div><div class="how">' +
         (h1row && h1row.cur === "H1" && h1row.act === "keep" ? "It is already the H1 on the site. Leave it as H1 and make sure nothing else on the page is an H1." : "Set this element to H1.") +
         ' Keep the wording exactly as it is on the page.</div></div>';
    if (H.proposed) h += '<div class="sugg"><div>' + SUGG + ' <span style="font-size:12px;color:var(--muted)">Possible H1 wording, only if the client agrees. Not for now.</span></div><div class="t">' + esc(H.proposed) + '</div><p class="why">' + esc(H.why||"") + '</p></div>';
  } else {
    const changed = H.proposed && H.proposed !== H.cur;
    h += (changed ? '<span class="pill p-rewrite">Needs client sign-off</span>' : '<span class="pill p-keep">No change</span>') + '</div>';
    h += '<div class="h1cols">' + (changed ? '<div class="h1alt cur"><small>Current H1</small><div class="t">' + esc(H.cur) + '</div></div>' : "") +
         '<div class="h1main"><small>' + (changed ? "New H1" : "H1") + '</small><div class="t">' + esc(changed ? H.proposed : H.cur) + '</div></div></div>';
    if (H.why) h += '<p class="why">' + esc(H.why) + '</p>';
  }
  h += '</section>';

  // map
  h += '<section class="block"><h2>Heading map, in page order</h2><p class="lede">Top to bottom as the page renders. Rows with a coloured action need work. Indent shows the final level.</p>';
  h += '<div class="toolbar"><label><input type="checkbox" id="onlyChanges"' + (hideKeep ? " checked" : "") + '> Show only rows that need work</label></div>';
  h += '<div class="map' + (hideKeep ? " hide-keep" : "") + '" id="map">';
  let lastLvl = 1, secHtml = "", rowsHtml = "", secHas = false, open = false;
  const flush = () => { if (open) h += secHtml.replace('class="sec"', 'class="sec' + (secHas ? "" : " empty") + '"') + rowsHtml; open = false; secHas = false; secHtml = ""; rowsHtml = ""; };
  p.rows.forEach(r => {
    if (r.s){ flush(); open = true; secHtml = '<div class="sec">' + esc(r.s) + '</div>'; return; }
    if (!open){ open = true; secHtml = '<div class="sec">Page</div>'; }
    const L = isH(r.rec) && r.act !== "remove" ? lvl(r.rec) : Math.min(lastLvl + 1, 6);
    if (isH(r.rec) && r.act !== "remove") lastLvl = L;
    if (WORK.includes(r.act)) secHas = true;
    let tags;
    if (r.act === "keep") tags = '<span class="tg new">' + r.rec + '</span>';
    else if (r.act === "none") tags = '<span class="tg txt">' + esc(tn(r.cur)) + '</span>';
    else if (r.act === "add") tags = '<span class="tg txt">new</span><span class="arrow">→</span><span class="tg new">' + r.rec + '</span>';
    else if (r.act === "remove" || (r.act === "retag" && !isH(r.rec))) tags = '<span class="tg old">' + esc(tn(r.cur)) + '</span><span class="arrow">→</span><span class="tg txt">text</span>';
    else if (r.cur === r.rec) tags = '<span class="tg new">' + r.rec + '</span>';
    else tags = '<span class="tg old">' + esc(tn(r.cur)) + '</span><span class="arrow">→</span><span class="tg new">' + r.rec + '</span>';
    let text;
    if (r.act === "rewrite" && r.to) text = '<div class="ht was">' + esc(r.text) + '</div><div class="ht now">' + esc(r.to) + '</div>';
    else if (r.act === "add") text = '<div class="ht now">' + esc(r.to || r.text) + '</div>';
    else text = '<div class="ht">' + esc(r.text) + '</div>';
    const a = ACT[r.act] || ACT.keep;
    rowsHtml += '<div class="row act-' + r.act + (isH(r.rec) ? " lv" + L : "") + '" style="--lvl:' + L + '"><div class="tags">' + tags + '</div><div class="txt">' + text + (r.note ? '<div class="rn">' + esc(r.note) + '</div>' : "") + '</div><div><span class="pill ' + a[0] + '">' + a[1] + '</span></div></div>';
  });
  flush();
  h += '</div></section>';

  if (p.notes && p.notes.length){
    h += '<section class="block"><h2>' + (LIVE ? "Suggestions for later" : "Other content ideas") + '</h2><p class="lede">' +
         (LIVE ? "Content and wording ideas spotted while checking headings. Not part of the tag work. Skip these for now." : "Copy and structure ideas beyond the headings. Review with the client.") +
         '</p><ul class="notes">' + p.notes.map(n => '<li>' + SUGG + '<span>' + esc(n) + '</span></li>').join("") + '</ul></section>';
  }

  h += '<section class="block"><h2>Checks</h2>' + checkList(pageChecks(p)) + '</section>';

  h += '<section class="block"><h2>Exact H tags for this page</h2><p class="lede">' + (LIVE ? "The final list after the tag changes, using the content on the page today." : "The final list after every change on this page, with the new wording.") + ' Everything not listed here is not a heading.</p>';
  h += '<div class="copyrow"><button class="btn primary" id="copyOutline" type="button">Copy list</button><span class="copied" id="copied" aria-live="polite"></span></div>';
  h += '<pre class="outline" id="outline">' + outlineText(p, true) + '</pre></section>';

  $("#main").innerHTML = h;
  $("#onlyChanges").addEventListener("change", e => { $("#map").classList.toggle("hide-keep", e.target.checked); store("hmap-hide-keep", e.target.checked ? "1" : "0"); });
  $("#copyOutline").addEventListener("click", () => copyText(p.name + " (" + p.path + ")\n" + outlineText(p, false), $("#outline")));
}
function copyText(t, el){
  const done = () => { const c = $("#copied"); if (c){ c.textContent = "Copied"; setTimeout(() => c.textContent = "", 1800); } };
  const sel = () => { if (!el) return; const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); const c = $("#copied"); if (c) c.textContent = "Selected. Press Ctrl/Cmd + C."; };
  try { navigator.clipboard.writeText(t).then(done, sel); } catch(e) { sel(); }
}

  WordPress:["<b>Re-tag:</b> select the Heading block and change the level in the block toolbar.","<b>Make heading:</b> select the Paragraph block → Transform → Heading, then set the level. In page builders, set the HTML tag in the widget’s settings.","<b>Theme parts:</b> site title, widget and footer headings are edited in the Site Editor or theme files."],
  Shopify:["<b>Re-tag:</b> use the section’s heading-tag setting where the theme offers one. Otherwise edit the section’s Liquid file.","<b>Make heading:</b> change the element in the section’s Liquid file and keep its classes.","<b>Templates:</b> product and collection titles are the H1 in their templates."],
  Wix:["<b>Re-tag:</b> select the text → Text settings → Heading 1–6.","<b>Keep the look, change the tag:</b> Text settings → SEO settings → HTML tag.","<b>Repeated sections:</b> check each page, because Wix has no shared components for most text."],

};

/* ---------- keyword map ---------- */
function renderKeywords(){
  let h = '<div class="crumb"><span>Guide</span></div><div class="pagehead"><h1>Keyword map</h1></div>';
  h += '<p class="intro">One owner page per keyword, so pages don’t compete. ' + (LIVE ? 'The H1 column shows whether today’s H1 already uses the page’s primary keyword; misses become suggestions on that page.' : 'The H1 column shows whether the new H1 uses the page’s primary keyword.') + '</p>';
  h += '<section class="block"><h2>Checks</h2>' + checkList(siteChecks().slice(0,2)) + '</section>';
  h += '<section class="block"><h2>Who owns what</h2><div class="tablewrap"><table><thead><tr><th>Page</th><th>Purpose</th><th>Primary</th><th>Secondary</th><th>In H1?</th></tr></thead><tbody>';
  PAGES.forEach(p => {
    const k = p.keywords || {}, pri = k.primary;
    const inH1 = pri && pri[0] ? kwIn(finalH1(p), pri[0]) : null;
    h += '<tr><td><a href="#' + p.id + '">' + esc(p.name) + '</a></td><td>' + esc(p.purpose || "") + '</td><td>' + (pri ? fmtKw(pri) : "Brand page") + '</td><td>' + (k.secondary || []).map(fmtKw).join("<br>") + '</td><td>' +
         (inH1 === null ? "n/a" : '<span class="pill ' + (inH1 ? "p-pass" : "p-fail") + '">' + (inH1 ? "Yes" : "No") + '</span>') + '</td></tr>';
  });
  h += '</tbody></table></div><p class="src" style="margin-top:8px">' + esc(SITE.kwSource) + '. Volumes are monthly searches.</p></section>';
  if (GAPS && GAPS.length) h += '<section class="block"><h2>Keywords no page owns yet</h2><p class="lede">Demand with no matching page. Possible new pages or sections, for later.</p><ul class="notes">' + GAPS.map(g => '<li>' + SUGG + '<span><b>' + esc(g.cluster) + '</b>' + (g.volume !== undefined ? ' (' + g.volume + '/mo)' : "") + '. ' + esc(g.note || "") + '</span></li>').join("") + '</ul></section>';
  $("#main").innerHTML = h;
}

/* ---------- later: suggestions / sign-off ---------- */
function signoffText(){
  const list = PAGES.filter(p => p.h1.proposed && p.h1.proposed !== p.h1.cur);
  let t = (LIVE ? "Suggested page title (H1) wording for SEO" : "Page title (H1) changes for your sign-off") + "\n\nThese keep the meaning and add the words buyers search for.\n\n";
  list.forEach((p,i) => t += (i+1) + ". " + p.name + "\n   Current: " + p.h1.cur + "\n   " + (LIVE ? "Suggested" : "New") + ": " + p.h1.proposed + "\n\n");
  return t.trim();
}
function renderLater(){
  const list = PAGES.filter(p => p.h1.proposed && p.h1.proposed !== p.h1.cur);
  const card = p => '<div class="card cq"><div class="pg"><a href="#' + p.id + '">' + esc(p.name) + '</a></div><div class="h1cols"><div class="h1alt cur"><small>Current H1</small><div class="t" style="font-size:16px">' + esc(p.h1.cur) + '</div></div><div class="h1main"><small>' + (LIVE ? "Suggested wording" : "New H1") + '</small><div class="t" style="font-size:16px">' + esc(p.h1.proposed) + '</div></div></div><p class="why">' + esc(p.h1.why || "") + '</p></div>';
  let h = '<div class="crumb"><span>Later</span></div><div class="pagehead"><h1>' + esc(LATER.name) + '</h1></div>';
  h += '<p class="intro">' + (LIVE ? "Wording and content ideas from the heading review, for later. None of these block the tag work." : "H1 changes to send the client, plus copy and structure ideas beyond the headings.") + '</p>';
  if (list.length){
    h += '<section class="block"><h2>H1 wording (' + list.length + ')</h2><div class="copyrow"><button class="btn primary" id="copySign" type="button">Copy as a message for the client</button><span class="copied" id="copied" aria-live="polite"></span></div>';
    h += '<pre class="outline" id="signPre" style="white-space:pre-wrap;font-family:var(--body);font-size:14px;line-height:1.6">' + esc(signoffText()) + '</pre><div class="clientlist" style="margin-top:12px">' + list.map(card).join("") + '</div></section>';
  }
  h += '<section class="block backlog"><h2>' + (LIVE ? "Content suggestions" : "Other ideas") + '</h2>';
  const sw = SITEWIDE.filter(s => s[0] === "content");
  if (sw.length) h += '<h3>Site-wide</h3><ul class="notes">' + sw.map(s => '<li>' + SUGG + '<span>' + esc(s[1]) + '</span></li>').join("") + '</ul>';
  PAGES.forEach(p => { if (!p.notes || !p.notes.length) return; h += '<h3><a href="#' + p.id + '">' + esc(p.name) + '</a></h3><ul class="notes">' + p.notes.map(n => '<li>' + SUGG + '<span>' + esc(n) + '</span></li>').join("") + '</ul>'; });
  h += '</section>';
  $("#main").innerHTML = h;
  const b = $("#copySign"); if (b) b.addEventListener("click", () => copyText(signoffText(), $("#signPre")));
}

/* ---------- router ---------- */
function route(){
  let id = (location.hash || "#overview").slice(1);
  if (!["overview","keywords","later"].includes(id) && !byId(id)) id = "overview";
  document.querySelectorAll(".nav a").forEach(a => a.getAttribute("data-id") === id ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current"));
  $("#pagePick").value = id;
  if (id === "overview") renderOverview(); else if (id === "keywords") renderKeywords(); else if (id === "later") renderLater(); else renderPage(byId(id));
  window.scrollTo(0,0);
}
$("#brandName").textContent = SITE.name;
$("#brandSub").textContent = LIVE ? "H-tag map · tags only" : "Heading plan · with rewrites";
$("#siteLink").href = SITE.url; $("#siteLink").textContent = "Open site ↗";
buildNav();
window.addEventListener("hashchange", route);
route();
</script>
